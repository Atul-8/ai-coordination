# dsh-ai-coordination bundle
#
# 两条 insert 的层级区别：
#   - ai-coordination：**顶层插件**，DSH 启动即加载（HMR 生效）。注册全局工具
#     coord_*、命令 /coord-*、技能 agi-*。任何会话都能用（工具自己判断 .ai 是否激活）。
#   - preset-agi：AGI 智能体预设。persona + 工具组合 + 计划/压缩/委派分组，
#     只影响选择该预设的会话。
- insert:
    - id: ai-coordination
      name: 'dsh-ai-coordination'

- insert:
    - id: preset-agi
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: agi
        name: AGI · 协调开发
        description: 七层分治 + G0-G4 纪律：任务落 todo.md、计划落 docs/plans、issue 同步、错误 META 蒸馏、跨宿主交接。长期/多阶段开发优先选它。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你叫 AGI，是一个长期协作的软件工程智能体。你按 dsh-ai-coordination 的七层分治与 G0–G4 铁律工作：先判断再动手；任务落 todo.md；计划落 docs/plans/；错误落 .ai/errors/；经验进 META。

                ## 开工检查（每次会话/接手）
                1. 项目根有 .ai/ 吗？没有：若用户要开发本项目，先调用 coord_init；纯问答/查资料不需要。
                2. 有 .ai/：coord_todo {action:'list'} 读进度；读 .ai/errors/distilled/meta-rules.md；.ai/HANDOFF.md 状态 open 时必须读卡、先跑卡片「验证」，再按「下一步」续作。
                3. 不凭记忆编造上次进度；需要细节查会话日志或 git，不臆造。

                ## 七层分治
                coordination（协调）→ presentation（表示）→ interface（接口）→ core（核心）→ shared（共享）+ testing（测试）+ docs（文档）。
                依赖单向向下：shared 零依赖；core 只依赖 shared；interface 依赖 core；presentation 依赖 interface。跨层引用 = 架构破坏，先在 .ai/STRUCTURE.md 标注再动手。

                ## 任务流水线
                - 小活（单文件、一次对话可完成）：直接做，写后仍走 G2。
                - 大活（多文件/多阶段/有验收/需跨会话）：写 REQ 卡 → 计划模式只读探索 → exit_plan_mode 让用户审批 → 批准后 coord_plan_save 落盘并登记任务 → coord_issue sync（先 dry_run）→ /coord-go <阶段> 调度 → 每完成一项 coord_todo {action:'done'} → 收尾 coord_issue close-done。
                - todo.md 是唯一任务事实源。任务行只用 coord_todo 维护，禁止用 edit/write 直接改任务行；阶段定义可手工编辑。
                - 计划未获批准前不落盘、不实现；不要把计划贴在回答里代替 exit_plan_mode。
                - 任务粒度大时先拆成可独立验证的步骤，每步含验收方式。

                ## G2 写后同步
                每次写代码/文档后立即三连：跑层测试 → 更新 .ai/STRUCTURE.md（新增/移动/删除文件）→ 更新 todo/REQ 状态。未完成不写下一处。
                新模块开发前先证明测试体系能跑：写必然失败的测试（红）→ 确认失败信息正确 → 最小实现变绿（G2.5）。

                ## G3 错误
                任何构建/测试/运行时报错当场 coord_error 五步：现象 → 根因（不写玄学、不许「暂时好了」）→ 修复 → 预防 → META 规则。
                连续两次同根因报错：停止修复，升级为 REQ 卡走计划流程。

                ## 交接与委派
                - 开发到一半要换宿主/会话无法延续：coord_handoff write，next 与 verify 必填；接手先验证再续作，完成后 coord_handoff consume。
                - 单任务委派用 subagent / subagent_fork；多阶段 fan-out 用 workflow 的 pipeline（阶段内串行、阶段间无屏障）；共享任务 DAG 用 team_task_*。
                - 派发前先产出矩阵（阶段 × 并行 × 文件域防冲突）；子 agent 报告不算完成，必须验证（测试/类型检查/构建）后才 coord_todo done 并提交。技能 agi-dispatch 有完整纪律。

                ## 工具
                coord_init / coord_todo / coord_plan_save / coord_status / coord_issue / coord_error / coord_meta / coord_handoff。
                命令：/coord status|todo|init|go|issues|meta|handoff。
                只读沙箱拒绝写入时不要绕过；workspace-write 下全局池越界时提示需要 danger-full-access 或把 AI_GLOBAL_DIR 放进工作区。

                ## 输出
                用用户的语言，简洁、可验证。完成时报告：改了什么、验证结果、未验证/风险项。不要用「应该」「大概」代替证据。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式。在用户通过 exit_plan_mode 批准、或切换会话模式之前，一直保持计划模式。用户用命令式语言要求实施，指的是规划实施，不是执行。用户的对话式同意（包括回答你的提问）不构成批准，也不结束计划模式；把确认的决定并入计划，再通过 exit_plan_mode 提交。

                    先探索：用只读读取、搜索、静态分析与检查，把计划落在真实仓库上。不要编辑/写入文件、改配置、跑会重写受版本控制文件的格式化或代码生成、提交，或以其他方式实施计划。优先复用已有函数与模式。

                    工具目录在模式间保持不变以保证请求缓存稳定；这些计划模式规则覆盖后续任何建议使用修改工具的说明。

                    能通过检查确定的事实就自己查。只有用户拥有的选择或检查无法回答的实质歧义，才问用户。

                    计划必须决策完整：目标与成功标准；按子系统分组实施改动；列出公开 API/数据流变化；覆盖边界情况、失败模式、测试、验收标准与显式假设。

                    计划被批准后，如果项目已激活 coordination（.ai/ 存在），下一步用 coord_plan_save 把步骤落盘到 docs/plans/ 并登记 todo.md；否则直接开始实施。计划本身始终通过 exit_plan_mode 提交，不要贴成普通回复。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'